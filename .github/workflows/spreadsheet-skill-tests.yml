name: spreadsheet-skill-tests

on:
  pull_request:
    paths:
      - "skills/spreadsheet-problem-solver/**"
      - "apps/web/src/components/HomeHero.tsx"
      - "apps/web/src/components/HomeView.tsx"
      - "apps/web/src/components/home-hero/chip-labels.ts"
      - "apps/web/src/components/home-hero/chips.ts"
      - "apps/web/src/i18n/**"
      - "apps/web/src/styles/home/home-hero.css"
      - "apps/web/tests/components/HomeView.skill-with-chip.test.tsx"
      - "apps/web/tests/home-hero-creation-i18n.test.ts"
      - ".github/workflows/spreadsheet-skill-tests.yml"
  push:
    paths:
      - "skills/spreadsheet-problem-solver/**"
      - "apps/web/src/components/HomeHero.tsx"
      - "apps/web/src/components/HomeView.tsx"
      - "apps/web/src/components/home-hero/chip-labels.ts"
      - "apps/web/src/components/home-hero/chips.ts"
      - "apps/web/src/i18n/**"
      - "apps/web/src/styles/home/home-hero.css"
      - "apps/web/tests/components/HomeView.skill-with-chip.test.tsx"
      - "apps/web/tests/home-hero-creation-i18n.test.ts"
      - ".github/workflows/spreadsheet-skill-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spreadsheet-skill-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Spreadsheet skill regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Create isolated Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install openpyxl

      - name: Compile spreadsheet scripts and tests
        run: |
          .venv/bin/python -m py_compile skills/spreadsheet-problem-solver/scripts/*.py
          .venv/bin/python -m py_compile skills/spreadsheet-problem-solver/tests/*.py

      - name: Run spreadsheet skill tests
        run: |
          .venv/bin/python -m unittest discover -s skills/spreadsheet-problem-solver/tests -v

  frontend-shortcut:
    name: Home spreadsheet shortcut regression and Web typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          postinstall-intent: workspace

      - name: Prebuild workspace type declarations
        run: |
          pnpm --filter @open-design/daemon build
          pnpm --filter @open-design/desktop build
          pnpm --filter @open-design/web build:sidecar

      - name: Run spreadsheet shortcut and localization tests
        run: |
          pnpm --filter @open-design/web test -- tests/components/HomeView.skill-with-chip.test.tsx tests/home-hero-creation-i18n.test.ts

      - name: Typecheck Web workspace
        run: pnpm --filter @open-design/web typecheck
